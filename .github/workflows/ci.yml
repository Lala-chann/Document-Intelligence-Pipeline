name: CI
 
on:
  push:
  pull_request:
  workflow_dispatch:   # Actions bolmesinden "Run workflow" ile elle isletmek ucun
 
jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # yalniz image GHCR-e gonderilende lazimdir
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
 
      - name: Build Docker image
        run: |
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t ticket-triage .
 
      - name: Start container
        run: docker run -d --name api -p 8000:8000 ticket-triage
 
      - name: Wait for /status
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/status > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in time"
          exit 1
 
      - name: Smoke test /predict (SVM)
        run: |
          response=$(curl --fail --silent -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"subject":"Internet down","body":"My internet has been down for 3 days, please help urgently","queue":"Technical Support","model":"svm"}')
          echo "$response"
          echo "$response" | grep -q '"priority"'
 
      # Yalniz test kecibse VE (default branch-e push olubsa YA elle isledilibse) gonderilir
      - name: Push image to GitHub Container Registry
        if: success() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == env.DEFAULT_BRANCH))
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"   # GHCR ad yalniz kicik herflerle olmalidir
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag ticket-triage "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_SHA"
          if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            docker tag ticket-triage "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
 
      - name: Show container logs on failure
        if: failure()
        run: docker logs api
 
      - name: Stop container
        if: always()
        run: docker rm -f api
